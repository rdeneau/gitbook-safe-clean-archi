name: 'Update Changelog in status.md'
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch: # Allows manual triggering of the update

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitBook Repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.UPDATE_COMMITS }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Run Changelog Generator
        env:
          GH_TOKEN: ${{ secrets.UPDATE_COMMITS }}
        run: dotnet run --project tools/ChangelogGenerator/ChangelogGenerator.fsproj -- "$GH_TOKEN"

      - name: Commit and push if changed
        run: |
          git config --local user.email "rdeneau@yahoo.fr"
          git config --local user.name "Romain Deneau"
          git add status.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: 📝 update status.md with latest commits [skip ci]"
            git push
          fi